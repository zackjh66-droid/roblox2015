{% extends "base.html" %}
{% block title %}Account Settings - BLOXEN{% endblock %}
{% block content %}
<div class="container-main" style="max-width:970px; margin: 70px auto 0; font-family:'Source Sans Pro',sans-serif;">
    <h1 style="font-size:22px; margin:0 0 12px;">Account Settings</h1>
    <div style="display:flex; gap:18px;">
        <div style="width:220px;">
            <div style="border:1px solid #ccc; border-radius:4px; padding:10px; font-size:13px;">
                <div style="padding:6px 8px; background:#f5f5f5; font-weight:600; border-radius:3px;">Account Info</div>
                <div style="padding:6px 8px;"><a href="/My/Character.aspx">Character</a></div>
                <div style="padding:6px 8px;"><a href="/My/Stuff.aspx">Inventory</a></div>
                <div style="padding:6px 8px;"><a href="/friends.aspx">Friends</a></div>
            </div>
        </div>
        <div style="flex:1; min-width:320px;">
            <div style="border:1px solid #ccc; border-radius:4px; padding:16px;">
                <form method="post" action="/My/Settings.aspx">
                    {% if saved %}<div style="color:#2e9e2e; font-size:12px; margin-bottom:8px;">Saved.</div>{% endif %}
                    <div class="form-label" style="font-size:12px;">Blurb</div>
                    <textarea name="blurb" rows="3" style="width:100%; font-size:12px;">{{ profile.blurb }}</textarea>
                    <div class="form-label" style="font-size:12px; margin-top:10px;">Location</div>
                    <input name="location" value="{{ profile.location or '' }}" style="width:300px; padding:4px; font-size:12px;" />
                    <div style="margin-top:12px;">
                        <button style="padding:5px 18px; font-size:12px; background:linear-gradient(#fff,#eee); border:1px solid #aaa; border-radius:3px; cursor:pointer;">Save</button>
                    </div>
                </form>
                <div style="margin-top:16px; border-top:1px solid #eee; padding-top:12px;">
                    <div class="form-label" style="font-size:12px;">Change Password</div>
                    <form method="post" action="/My/Settings.aspx?action=password">
                        <input name="current" type="password" placeholder="Current password" style="padding:4px; font-size:12px; margin-right:6px;" />
                        <input name="new" type="password" placeholder="New password" style="padding:4px; font-size:12px; margin-right:6px;" />
                        <button style="padding:4px 14px; font-size:12px; background:linear-gradient(#fff,#eee); border:1px solid #aaa; border-radius:3px;">Change</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
